name: Build HyperTube Release / Tagged APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*"

permissions:
  contents: write

jobs:
  release-apk:
    name: Build & Release HyperTube APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build Ready-to-Install APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk HyperTube-${{ github.ref_name }}.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyperTube-${{ github.ref_name }}-APK
          path: HyperTube-${{ github.ref_name }}.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "HyperTube ${{ github.ref_name }}"
          body: |
            ## HyperTube ${{ github.ref_name }}
            - **Lead Developer**: shumail0ahmed
            - Ready-to-install APK attached below.
          files: HyperTube-${{ github.ref_name }}.apk
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
