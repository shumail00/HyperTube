name: Build HyperTube Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "README*.md"
      - ".github/**/*.md"
  pull_request:
    paths-ignore:
      - "README*.md"
      - ".github/**/*.md"

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build & Upload Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.3.1"

      - name: Ensure debug.keystore exists
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Compile HyperTube Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare Debug APK
        run: cp app/build/outputs/apk/debug/app-debug.apk HyperTube-debug.apk

      - name: Upload HyperTube Debug APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: HyperTube-Debug-APK
          path: HyperTube-debug.apk
          if-no-files-found: error

      - name: Publish Automatic Debug Release on GitHub
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: "HyperTube Debug Build (Latest)"
          body: |
            Automated **HyperTube** Debug APK built by GitHub Actions.
            - **Developer**: shumail0ahmed
            - **Commit**: `${{ github.sha }}`
            - Install `HyperTube-debug.apk` directly on your Android phone or 16:10 tablet.
          files: HyperTube-debug.apk
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
